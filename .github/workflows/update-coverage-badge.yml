name: Update Coverage Badge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-badge:
    name: Update Coverage Badge
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      # persist-credentials is intentionally on (default) - the job needs the
      # workflow token to push the regenerated badge back to the branch.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        # --ignore-scripts: this job keeps a push-capable token in git config
        # (persist-credentials), so dependency install scripts must not run.
        # Coverage needs none of them.
        run: npm ci --ignore-scripts

      - name: Generate Coverage Report
        run: npm run coverage

      - name: Commit and push badge if changed
        run: |
          if git diff --quiet badges/coverage.svg; then
            echo "Coverage badge unchanged - nothing to commit"
            echo "## Coverage Badge: no change" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          STATEMENTS=$(jq -r '.total.statements.pct' coverage/coverage-summary.json)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badges/coverage.svg
          git commit -m "chore: update coverage badge to ${STATEMENTS}%"
          git push

          {
            echo "## Coverage Badge Updated"
            echo ""
            echo "Statements coverage: **${STATEMENTS}%**"
          } >> "$GITHUB_STEP_SUMMARY"
