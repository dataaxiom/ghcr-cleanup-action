rules:
  # The GHCR_PAT secret is used in exactly one job (multi-package-cleanup-regex)
  # as the `token:` input to a composite action - never interpolated into a
  # shell `run:` block, never logged, and guarded by `if: env.GHCR_PAT`. The
  # defence-in-depth gain from a dedicated GitHub Environment isn't worth the
  # per-fork setup cost for this single-secret use case.
  secrets-outside-env:
    ignore:
      - ci.yml

  # False positive: zizmor flags any setup-node + docker/build-push-action pair
  # as potential cache-poisoning, but our setup-node invocations in
  # github-attestation-tests, cosign-test, cosign-oci11-test and
  # bare-oci11-referrer-test deliberately omit `cache: npm` -
  # setup-node does not cache unless explicitly told to. Node is installed in
  # those jobs only to run citester/index.js (already-bundled JS), not to
  # install npm packages. zizmor's own audit confidence is "Low" here.
  cache-poisoning:
    ignore:
      - ci.yml

  # `pull_request_target` is the intended trigger here. The integration tests
  # need GHCR write access from fork PRs (the test images push to
  # ghcr.io/<owner>/<repo>), and `pull_request` downgrades GITHUB_TOKEN to
  # read-only for fork PRs - breaking the test design. This repo only uses
  # ghcr.io for ephemeral CI test artifacts; nothing is published from here, so
  # the trade-off favours integration coverage over zizmor's blanket warning.
  # Safety: the workflow DOES check out and run the PR's HEAD (ref:
  # head.sha), so the controls are instead:
  # 1. The pr-integration-tests environment gate - every job that runs
  #    fork code with packages:write, GHCR_PAT, or id-token waits on
  #    maintainer approval via pr-integration-tests-gate.
  # 2. No job runs fork code before approval: general-tests waits on the
  #    gate too. It holds only a read-only GITHUB_TOKEN and no secrets,
  #    but under pull_request_target any job can still write to the base
  #    branch's Actions cache (e.g. via setup-node's npm cache or the
  #    runner's cache token), which privileged push runs on main restore.
  #    Every job also checks out with persist-credentials: false.
  dangerous-triggers:
    ignore:
      - ci.yml

  # update-coverage-badge.yml is a manual `workflow_dispatch` that intentionally
  # leaves persist-credentials at its default so it can commit + push the
  # regenerated badges/coverage.svg back to the branch it ran on. Removing
  # credentials would break the workflow's purpose.
  artipacked:
    ignore:
      - update-coverage-badge.yml
